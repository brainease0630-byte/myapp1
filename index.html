<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>한의원 건강 체크</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1>🌿 건강 체크</h1>
  <div class="date-row">
    <button id="prev" aria-label="전날">‹</button>
    <input type="date" id="date">
    <button id="next" aria-label="다음날">›</button>
  </div>
</header>

<main>
  <!-- 오늘 기록 -->
  <section id="tab-today" class="tab active">
    <div class="card">
      <h2>😴 수면</h2>
      <div class="row2">
        <label>취침<input type="time" id="bedtime"></label>
        <label>기상<input type="time" id="waketime"></label>
      </div>
      <p class="hint" id="sleepTotal"></p>
      <label class="lbl">수면의 질</label>
      <div class="seg" data-key="sleepQuality" data-options="1:매우 나쁨,2:나쁨,3:보통,4:좋음,5:아주 좋음"></div>
      <label class="lbl">수면 중 문제 (복수 선택)</label>
      <div class="chips" data-key="sleepIssues" data-options="잠들기 어려움,자주 깸,꿈 많음,새벽에 깸,낮잠"></div>
    </div>

    <div class="card">
      <h2>🩹 통증</h2>
      <label class="lbl">통증 정도 <b id="painVal">0</b> / 10</label>
      <input type="range" id="pain" min="0" max="10" step="1" value="0">
      <div class="scale"><span>😀 없음</span><span>😐 보통</span><span>😣 심함</span></div>
      <label class="lbl">통증 부위 (복수 선택)</label>
      <div class="chips" data-key="painAreas" data-options="머리,목,어깨,등,허리,골반,무릎,팔·손목,다리·발,배·복부,가슴"></div>
      <label class="lbl">통증 양상</label>
      <div class="chips" data-key="painType" data-options="쑤심,찌름,뻐근함,저림,당김,욱신거림,타는 듯함"></div>
      <label class="lbl">메모</label>
      <textarea id="painNote" rows="2" placeholder="언제 더 아픈지, 움직일 때/가만히 있을 때 등"></textarea>
    </div>

    <div class="card">
      <h2>🍚 식단</h2>
      <label class="lbl">식사 (먹은 끼니)</label>
      <div class="chips" data-key="meals" data-options="아침,점심,저녁,간식,야식"></div>
      <label class="lbl">식사 내용 메모</label>
      <textarea id="mealNote" rows="2" placeholder="예) 아침: 밥, 된장국 / 점심: 국수"></textarea>
      <label class="lbl">먹은 것 (복수 선택)</label>
      <div class="chips" data-key="foods" data-options="찬 음식,찬 음료,밀가루,튀김·기름진 것,맵고 짠 것,단 것,커피,술,인스턴트"></div>
      <label class="lbl">물 섭취: <b id="waterVal">0</b> 잔</label>
      <div class="stepper"><button data-step="water" data-d="-1">−</button><span id="waterBig">0</span><button data-step="water" data-d="1">＋</button></div>
      <label class="lbl">소화 상태</label>
      <div class="seg" data-key="digestion" data-options="1:불편,2:약간 불편,3:보통,4:좋음"></div>
    </div>

    <div class="card">
      <h2>🚶 생활</h2>
      <label class="lbl">운동 / 걷기: <b id="exVal">0</b> 분</label>
      <input type="range" id="exercise" min="0" max="180" step="10" value="0">
      <label class="lbl">스트레스</label>
      <div class="seg" data-key="stress" data-options="1:낮음,2:약간,3:보통,4:높음,5:매우 높음"></div>
      <label class="lbl">컨디션 / 기분</label>
      <div class="seg" data-key="mood" data-options="1:😫,2:😕,3:😐,4:🙂,5:😄"></div>
      <label class="lbl">대변</label>
      <div class="chips single" data-key="bowel" data-options="정상,변비,묽음·설사,없음"></div>
      <label class="lbl">복약 / 치료</label>
      <div class="chips" data-key="care" data-options="한약 복용,침·뜸 치료,스트레칭,족욕·반신욕"></div>
      <label class="lbl">기타 메모</label>
      <textarea id="note" rows="2" placeholder="원장님께 전하고 싶은 내용"></textarea>
    </div>

    <button class="primary" id="save">저장하기</button>
    <p class="toast" id="toast" hidden>저장되었습니다 ✔</p>
  </section>

  <!-- 기록 보기 -->
  <section id="tab-history" class="tab">
    <div class="card">
      <h2>📈 최근 14일 추이</h2>
      <div class="legend"><span class="d pain"></span>통증 <span class="d sleep"></span>수면시간(h)</div>
      <svg id="chart" viewBox="0 0 320 160" role="img" aria-label="통증과 수면시간 추이"></svg>
      <p class="hint" id="avgText"></p>
    </div>
    <div class="card">
      <h2>📋 기록 목록</h2>
      <ul id="list" class="list"></ul>
    </div>
    <div class="card">
      <h2>진료 때 보여드리기</h2>
      <button class="secondary" id="copyBtn">최근 7일 요약 복사</button>
      <button class="secondary" id="csvBtn">CSV 파일로 저장</button>
    </div>
  </section>

  <!-- 설정 -->
  <section id="tab-settings" class="tab">
    <div class="card">
      <h2>내 정보</h2>
      <label class="lbl">이름 (선택)</label>
      <input type="text" id="pname" placeholder="홍길동">
      <label class="lbl">매일 알림 시간 (앱이 열려 있을 때)</label>
      <input type="time" id="remind">
      <button class="secondary" id="saveSettings">저장</button>
    </div>
    <div class="card">
      <h2>앱 설치 방법</h2>
      <p class="hint"><b>안드로이드:</b> 크롬 메뉴 → “홈 화면에 추가”<br><b>아이폰:</b> 사파리 공유 버튼 → “홈 화면에 추가”</p>
      <button class="secondary" id="installBtn" hidden>홈 화면에 설치</button>
    </div>
    <div class="card">
      <h2>개인정보 안내</h2>
      <p class="hint">입력한 기록은 이 기기(브라우저)에만 저장되며 서버로 전송되지 않습니다. 브라우저 데이터를 삭제하면 기록도 지워집니다.</p>
      <button class="danger" id="wipe">모든 기록 삭제</button>
    </div>
  </section>
</main>

<nav class="bottom">
  <button data-tab="today" class="on">✍️<span>오늘 기록</span></button>
  <button data-tab="history">📈<span>기록 보기</span></button>
  <button data-tab="settings">⚙️<span>설정</span></button>
</nav>
<script src="app.js"></script>
</body>
</html>
